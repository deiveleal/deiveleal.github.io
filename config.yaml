baseURL: "https://deiveleal.de"
locale: "en-us"
title: "Deive Leal"
theme: hugo-profile

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

pagination:
  pagerSize: 3
enableRobotsTXT: true
# disqusShortname: your-disqus-shortname
# googleAnalytics: G-MEASUREMENT_ID

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    # "Blog" é o item pai do dropdown (sem url = apenas abre o menu)
    - identifier: blog
      name: Blog
      title: Blog
      weight: 1
    - identifier: blog-all
      name: Todos os posts
      title: Todos os posts
      url: /blogs
      parent: blog
      weight: 1
    - identifier: blog-podcast
      name: Podcast
      title: Podcast
      url: /blogs/podcast
      parent: blog
      weight: 2
    - identifier: blog-tecnico
      name: Técnico
      title: Técnico
      url: /blogs/tecnico
      parent: blog
      weight: 3
    - identifier: blog-pesquisas
      name: Pesquisas
      title: Pesquisas
      url: /blogs/pesquisas
      parent: blog
      weight: 4

params:
  title: "Deive Leal"
  description: This is my presentation site with my resume and blog and projects.
  # staticPath: ""  # The path to serve the static files from
  favicon: "/logo.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Deive Leal" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: true
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hello, I'm"
    title: "Deive."
    subtitle: "IT & Data Architect bridging data engineering, cloud, and research."
    content: "I'm an IT Architect at [Bradesco](https://www.bradesco.com.br/) and a Ph.D. candidate in Technology (ICT) at [Unicamp](https://www.unicamp.br/). I design data platforms and cloud solutions across AWS and Azure — from data modeling and ETL to solution architecture — pairing an engineering mindset with a background in social science. My research explores multimodal machine learning and feature selection applied to the healthcare domain."
    image: /images/profile/profile_photo_v1.jpeg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "https://drive.google.com/file/d/1ARZTVNBlwKs8nkAFluROer-GvyiqtcjJ/view?usp=sharing"
      download: false
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/deiveleal
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/deiveleal/
      # customIcons:
      #   - icon: /fav.png
      #     url: "https://example.com"

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/profile/about_me.jpg"
    content: "I work at the intersection of data engineering, architecture, and research. I hold an MSc in Technology (ICT) from Unicamp, an MBA in Data Engineering from the Polytechnic School of UFRJ, and a postgraduate degree in Data Architecture from PUC Minas — and I'm currently a Ph.D. candidate at Unicamp. My path is interdisciplinary, moving from Anthropology into data, and I'm a member of the HUMAINA research group (Unicamp / FGCU-Florida / USP), focused on multimodal machine learning. I design and deliver data solutions with Python, SQL, PySpark, Airflow, Databricks, Terraform, AWS and Azure, and I hold AWS and Microsoft Azure certifications."
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "Python"
        - "SQL"
        - "PySpark"
        - "Airflow"
        - "Databricks"
        - "AWS"
        - "Azure"
        - "Terraform"
        - "Data Architecture"
        - "Multimodal Machine Learning"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - job: "IT Architect"
        company: "Bradesco"
        companyUrl: "https://www.bradesco.com.br/"
        date: "Mar 2025 - Present"
        content: "Enterprise IT and solution architecture at one of Brazil's largest banks — designing and documenting solutions (C4 model) and aligning data and cloud standards across AWS and Azure."

      - job: "Senior Data Engineer"
        company: "BRQ Digital Solutions"
        companyUrl: "https://www.brq.com/"
        date: "Aug 2024 - Feb 2025"
        content: "Led data engineering initiatives — building and evolving data pipelines, models and big data processing with Python, SQL, PySpark, Airflow and Databricks."

      - job: "Data Engineer"
        company: "BRQ Digital Solutions"
        companyUrl: "https://www.brq.com/"
        date: "Jul 2022 - Aug 2024"
        info:
          enable: true
          content: "Outsourced at Itaú Unibanco."
        content: "Data engineering for a large financial institution — ETL/ELT pipelines, data modeling and big data workloads on Databricks, Hadoop and Hive."

      - job: "Data Engineer"
        company: "A3Data"
        companyUrl: "https://a3data.com.br/"
        date: "Dec 2021 - Jul 2022"
        content: "Data engineering consulting — pipelines, data modeling and analytics solutions on cloud platforms."

      - job: "Data Engineer"
        company: "Accenture Brazil"
        companyUrl: "https://www.accenture.com/br-pt"
        date: "Apr 2021 - Nov 2021"
        content: "Data engineering on enterprise projects — building ETL pipelines and data solutions."

  # Education
  education:
    enable: true
    # title: "Custom Name"
    index: false
    items:
      - title: "Ph.D. Candidate in Technology (Information & Communication Systems)"
        school:
          name: "Universidade Estadual de Campinas (Unicamp)"
          url: "https://www.unicamp.br/"
        date: "2026 - Present"
        content: "Research in data visualization and machine learning."
      - title: "MSc in Technology (Information & Communication Systems)"
        school:
          name: "Universidade Estadual de Campinas (Unicamp)"
          url: "https://www.unicamp.br/"
        date: "2023 - 2025"
        content: "Feature selection, multimodal machine learning, natural computation and bio-inspired algorithms."
      - title: "Postgraduate Degree in Data Architecture"
        school:
          name: "PUC Minas"
          url: "https://www.pucminas.br/"
      - title: "MBA in Data Engineering"
        school:
          name: "Polytechnic School of UFRJ"
          url: "https://www.poli.ufrj.br/"
        date: "2022 - 2023"
      - title: "Technologist in Systems Analysis and Development"
        school:
          name: "Federal Institute of São Paulo (IFSP)"
          url: "https://www.ifsp.edu.br/"
        date: "2019 - 2021"

  # Achievements
  achievements:
    enable: true
    title: "Certifications & Publications"
    items:
      - title: "AWS Certified Solutions Architect – Associate"
        content: "Amazon Web Services"
      - title: "Microsoft Certified: Azure Data Fundamentals"
        content: "Microsoft"
      - title: "Microsoft Certified: Azure AI Fundamentals"
        content: "Microsoft"
      - title: "Microsoft Certified: Azure Fundamentals"
        content: "Microsoft"
      - title: "Databricks Lakehouse Fundamentals"
        content: "Academy Accreditation — Databricks"
      - title: "Bio-inspired Feature Selection in Multimodal Machine Learning Applied in the Healthcare Domain: A Systematic Review"
        content: "Publication — systematic review on multimodal ML in healthcare."
      - title: "Feature Selection with Evolutionary and Swarm Algorithms for Multimodal Learning on a Synthetic Dataset"
        content: "Publication — multimodal learning and natural computation."
      - title: "Aplicação de princípios de Data Mesh em modelos organizacionais"
        content: "Publication — Data Mesh applied to organizational models."
      - title: "Pentaho, Airflow e Python: avaliação de ferramentas para criação de pipeline de dados"
        content: "Publication — evaluation of data pipeline tools."
      - title: "O uso da Internet na campanha eleitoral de 2010"
        content: "Publication — political communication and social science."

  # projects
  projects:
    enable: false
    # title: "Custom Name"
    items:
      - title: Hugo Profile
        content: A highly customizable and mobile first Hugo template for personal portfolio and blog.
        image: /images/projects/profile.png
        featured:
          name: Demo
          link: https://hugo-profile.netlify.app
        badges:
          - "Hugo"
          - "Bootstrap"
          - "Javascript"
        links:
          - icon: fa fa-envelope
            url: mailto:?subject=Hugo%20Profile%20Template&body=Check%20it%20out:%20https%3a%2f%2fhugo-profile.netlify.app%2fblog%2fmarkdown-syntax%2f
          - icon: fab fa-github
            url: https://github.com/gurusabarish/hugo-profile
          - icon: fab fa-twitter
            url: https://twitter.com/intent/tweet?text=Check+it+out:&url=https%3A%2F%2Fgithub.com%2Fgurusabarish%2Fhugo-profile

      - title: Image Converter
        content: A web app to convert image to pdf, png to jpg, png to jpg and png to webp without database using django.
        image: /images/projects/converter.jpg
        featured:
          name: Demo
          link: https://django-converter.herokuapp.com
        badges:
          - "Django"
          - "Bootstrap"
        links:
          - icon: fab fa-github
            url: /content/projects/emoji-support.md

      - title: Hugo Profile V2
        content: A clean and simple Hugo template for personal portfolio and blog.
        image: /images/projects/profile2.jpg
        featured:
          name: Demo V2
          link: https://hugo-profile-2.netlify.app
        badges:
          - "Hugo"
          - "Bootstrap"
          - "Javascript"
        links:
          - icon: fab fa-github
            url: https://github.com/gurusabarish/HugoProfileV2

  #Contact
  contact:
    enable: true
    # title: "Custom Name"
    content: My inbox is always open. Whether you have a question or just want to say hi, I’ll try my best to get back to you!
    btnName: Mail me
    btnLink: mailto:deive@deiveleal.de
    # formspree:
    #   enable: true # `contact.email` value will be ignored
    #   formId: abcdefgh # Take it from your form's endpoint, like 'https://formspree.io/f/abcdefgh'
    #   emailCaption: "Enter your email address"
    #   messageCaption: "Enter your message here"
    #   messageRows: 5

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/deiveleal
      linkedin: https://www.linkedin.com/in/deiveleal/

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    pageNotFound: "Page not found"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

  #customScripts: -| # You can add custom scripts which will be added before </body> tag
  #  <script type="text/javascript"><!-- any script here --></script>
